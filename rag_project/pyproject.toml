[project]
name = "rag-project"
version = "0.1.0"
description = "A from-scratch RAG system over the AI/ML knowledge base"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "numpy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "streamlit>=1.37",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_project"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
