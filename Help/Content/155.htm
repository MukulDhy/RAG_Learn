        <div id="topic" style="float: none;">
            <h2 xmlns="http://www.w3.org/1999/xhtml">Description</h2>
            <p xmlns="http://www.w3.org/1999/xhtml">There is a <span style="font-weight: bold;">Keyboard Shortcut</span> to activate the <span style="font-weight: bold;">Line Tool</span>. &#160;Place the <a href="039.htm#edit_box">Edit Box</a> on a rung in the <span style="font-weight: bold;">Ladder Editor</span> and press the <span style="font-weight: bold;">CTRL Key</span>. The <span style="font-weight: bold;">CTRL Key</span> activates the <span style="font-weight: bold;">Line Tool</span> (as shown), and <span style="font-weight: bold;">CTRL + Arrow Key</span> extends the line in the desired direction.</p>
            <p style="margin-left: 72px;" align="center" xmlns="http://www.w3.org/1999/xhtml">
