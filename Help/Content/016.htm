        <div id="topic" style="float: none;">
            <h2 xmlns="http://www.w3.org/1999/xhtml">Description</h2>
            <p xmlns="http://www.w3.org/1999/xhtml">The <span style="font-weight: bold;"><a name="kanchor182"></a>Title Bar</span> displays the <span style="font-weight: bold;">Project File Name</span> and the <span style="font-weight: bold;">Program Name</span> that is currently open. In addition, the <span style="font-weight: bold;">Title Bar</span> has the three buttons familiar to <span style="font-weight: bold;">Windows

</span> users: <span style="font-weight: bold;">Minimize</span>, <span style="font-weight: bold;">Maximize</span>, and <span style="font-weight: bold;">Close</span>.</p>
